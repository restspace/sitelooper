# Third-party benchmark target: ERPNext on the Frappe framework (real
# production app we did not write).
#
# Widens the matrix by CLIENT TECHNOLOGY: Frappe's desk is its own jQuery SPA
# framework, which no other target runs. History routing under /app/...;
# link fields are Awesomplete autocompletes that only count once a record is
# CHOSEN from the dropdown; the Sales Order items table is an editable child
# GRID (rows added with "Add Row", cells turn into inputs on click); a document
# is saved (Ctrl+S / Save) and then Submitted through a confirm dialog, moving
# docstatus Draft -> To Deliver and Bill; ids are minted naming-series names
# (SAL-ORD-2026-00001) shown in the url and heading; the timeline has a comment
# box.
#
# Based on frappe_docker's pwd.yml, pinned to a concrete v15 image (not the
# floating v15 / latest tags, which pwd.yml now points at v16). Every service
# is spelled out with its own `image:` line, because bench/cloud-setup.sh
# pre-pulls by grepping them (a YAML anchor would hand it "&img").
#
#   configurator  writes common_site_config.json (db + redis hosts), then exits
#   create-site   `bench new-site frontend --install-app erpnext`, then exits.
#                 First boot only (it skips an existing site); takes several
#                 minutes on a cold box. bench/cloud-setup.sh waits for it.
#   frontend      nginx on :8080 -> host 127.0.0.1:8100. FRAPPE_SITE_NAME_HEADER
#                 is the LITERAL "frontend", so nginx sends X-Frappe-Site-Name:
#                 frontend whatever Host the browser used, and the one site
#                 (named "frontend") answers http://127.0.0.1:8100.
#
# The Setup Wizard is completed by seed.sh (bench execute ... setup_complete),
# so no /app/setup-wizard is ever left open.
#
#   up:    docker compose -f bench/thirdparty/erpnext/docker-compose.yml up -d
#   seed:  bash bench/thirdparty/erpnext/seed.sh   (once: setup wizard, site config)
#   reset: node bench/reset-app.mjs --target erpnext   (idempotent: seeds records too)
#   web:   http://127.0.0.1:8100   (Administrator / bench-admin-pass)
#   api:   /api/resource, session cookie from POST /api/method/login
services:
  backend:
    image: frappe/erpnext:v15.121.5
    restart: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: bench-root-pass
      MARIADB_ROOT_PASSWORD: bench-root-pass
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:v15.121.5
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:v15.121.5
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      configurator:
        condition: service_completed_successfully
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 300 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 300 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -f "sites/frontend/site_config.json" ] && grep -q db_name sites/frontend/site_config.json; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=bench-admin-pass --db-root-username=root --db-root-password=bench-root-pass --install-app erpnext --set-default frontend || exit 1;
          echo "BENCH: site frontend created";
        fi;

  db:
    image: mariadb:10.6.28
    restart: on-failure
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 30
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: bench-root-pass
      MARIADB_ROOT_PASSWORD: bench-root-pass
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: frappe/erpnext:v15.121.5
    restart: on-failure
    depends_on:
      - websocket
      - backend
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 300
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "127.0.0.1:8100:8080"

  queue-long:
    image: frappe/erpnext:v15.121.5
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: frappe/erpnext:v15.121.5
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2.24-alpine
    restart: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2.24-alpine
    restart: on-failure

  scheduler:
    image: frappe/erpnext:v15.121.5
    restart: on-failure
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:v15.121.5
    restart: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
